[project]
name = "agent-mitm-proxy"
version = "0.1.0"
description = "A TLS-intercepting egress proxy with an allowlist, for sandboxed coding agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running proxy and client container (see tests/integration)"]

[tool.ruff]
line-length = 100
target-version = "py311"
